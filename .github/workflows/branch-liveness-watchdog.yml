name: branch-liveness-watchdog (CFP-2772 Phase 2 / ADR-164)

# 병렬 에이전트/브랜치 stale 감지 — 외부 watchdog cron poller (D2).
# Jira per-branch heartbeat relay 코멘트를 read-only 로 주기 폴링해
# monotonic seq + watchdog-own-clock 기반 3-state 판정(fresh/stalled/unknown).
#
# ★ ADR-164 §결정 2: ubuntu-latest HOSTED ONLY (self-hosted 금지, co-death F-1).
#   본 watchdog 는 session-무관 fault-independent 수집기 역할. self-hosted runner
#   session 부착 시 둘이 동시사망(co-death) → detection 무력화 ∴ HARD 제약.
#
# tier = warning-first (advisory, 차단 권한 0):
#   cron 실패 ≠ merge 저지. durable verdict 표면(GitHub native GITHUB_STEP_SUMMARY).
#   워크플로 자신은 required check context 에 미등장.
#
# cron cadence: 15분 poll (GH cron 5분 floor + 최대 jitter 30분 → 실제 간격 5~35분)
#   — 임계 floor(30~60분) 보다 촘촘히 poller.cadence 구성해 false-negative 최소화.
#
# credential (secret-absent = dry-run):
#   JIRA_READ_TOKEN = Jira read-only 토큰 (org-wide-read accepted-risk — 명시 disclosure 의무,
#                     ADR-099 Amendment 2 §A2-0 패턴. 암묵 위임 금지).
#   ATLASSIAN_USER_EMAIL = Jira 계정 이메일 (required for read-only auth, not write).
#   부재 → graceful dry-run(fetch 0, empty comments feed, verdict=all unknown, exit 0).
#
# meta-observer (Tier 2, §결정 7): watchdog 는 자기 last-run marker 기록 → 부재(>2× cron)=alarm.
#   marker-file 은 durable(workflow artifacts or tree-commit 여지, Phase 2 residual).

on:
  schedule:
    # 15분 폴링. 참조: GH Actions cron 최소 5분 + 최대 20분 jitter(실제론 최대 30분).
    #   따라서 실제 폴링 간격 = 5~35분. 임계(30~60분 floor) 보다 촘촘하지만
    #   quota(GitHub 5000/hr) 정도(~3.5 req/min 여유)는 안전.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_STEP_SUMMARY = CI-native durable verdict surface (requires actions:write 없음, default OK).

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watchdog:
    name: branch-liveness-watchdog
    runs-on: ubuntu-latest
    # 비차단: cron 실패가 merge 저지 못함. workflow artifact 또는 STEP_SUMMARY 기록.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet pyyaml

      - name: Fetch per-branch heartbeat relay comments from Jira
        id: fetch-comments
        env:
          JIRA_READ_TOKEN: ${{ secrets.JIRA_READ_TOKEN }}
          ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
        run: |
          set +e  # 실패 처리 후속 단계로 위임

          # ★ CFP-2995 — 전 분기 공통 방출 (AC-4 ③: 분기별 출력 키 집합 동일).
          #   신규 raw 스칼라 2종(http_code · curl_rc)은 **전 분기 전건 방출**한다.
          #   curl 미실행 분기 sentinel = `not-executed` — **값공간 밖 명시 토큰**.
          #   ★ `000` 을 sentinel 로 쓰지 않는 것은 선택이 아니라 강제다: transport 실패 시
          #     `-w '%{http_code}'` 가 실제로 `000` 을 낸다(rc=6, `-o` 파일 미생성). `000` 을
          #     dry-run 에 쓰면 「curl 이 돌았고 전송이 실패했다」와 「curl 이 돌지 않았다」가
          #     한 값으로 붕괴한다 — 미관측을 관측치로 인코딩하는 형태 그 자체다.
          #   ★ 빈 값·키 부재도 배제 — 그것이 본 Story 가 없애려는 침묵 자신이다.
          HTTP_CODE="not-executed"
          CURL_RC="not-executed"

          emit_observation() {
            # emit_observation <comments_file> <fetch_status> <collected_count> <unobserved_reason>
            {
              echo "comments_file=$1"
              echo "fetch_status=$2"
              echo "collected_count=$3"
              echo "unobserved_reason=$4"
              echo "http_code=${HTTP_CODE}"
              echo "curl_rc=${CURL_RC}"
            } >> "$GITHUB_OUTPUT"
          }

          # ── 분기 ① dry-run (credential 부재) — curl 미실행 ───────────────────────
          if [[ -z "${JIRA_READ_TOKEN:-}" ]] || [[ -z "${ATLASSIAN_USER_EMAIL:-}" ]]; then
            echo "[branch-liveness-watchdog] WARNING: JIRA_READ_TOKEN 또는 ATLASSIAN_USER_EMAIL 부재 — dry-run mode (fetch 0)" >&2
            echo "[]" > comments.json  # empty feed
            # AC-29 (CFP-2984): 수집 0 "사실" + 그 "사유" 를 구조화 필드로 동반 방출 (exit 0 무접촉).
            emit_observation "comments.json" "dry-run" "0" "credential-absent"
            exit 0
          fi

          # Jira REST API v3 getComments on control issue (progress_mirror.mirror_issue_key from project.yaml)
          # 실 Jira cloud_id/issue_key 는 프로젝트 config 에서 읽음.
          CONTROL_ISSUE_KEY="KAN-2"  # project.yaml atlassian.jira.progress_mirror.mirror_issue_key
          CLOUD_ID="0729a627-5f0e-4e17-b8d1-0365ba887d41"  # project.yaml atlassian.jira.cloud_id

          # ★ CFP-2995 AC-2 형태② — 요청 페이지 창을 **명시 기록**한다 (요청 자체는 무변경).
          #   본 요청은 페이지 파라미터를 전송하지 않으며 페이지 루프도 돌지 않는다 = 서버 기본
          #   창 1페이지만 취득한다. 그 사실을 하류 truncation 판정의 전제로 넘긴다.
          #   ★ 관측성 전용 경계 준수: 페이지를 **더 가져오지 않는다**. 바꾸는 것은 «무엇을
          #     보고하는가» 뿐이고 «어떤 응답이 도착하는가» 는 건드리지 않는다 (URL 수정·
          #     `--max-time`·`Retry-After` 를 별건으로 낸 기준과 같은 절단면).
          PAGE_WINDOW_REQUESTED="server-default(single page, no loop)"

          # Jira REST API v3 getComments endpoint
          JIRA_URL="https://api.atlassian.com/ex/jira/${CLOUD_ID}/rest/api/3/issue/${CONTROL_ISSUE_KEY}/comments"

          echo "[branch-liveness-watchdog] fetching heartbeat comments from ${CONTROL_ISSUE_KEY} (page window: ${PAGE_WINDOW_REQUESTED})..." >&2

          # ★ CFP-2995 — HTTP 상태 witness 를 **exit code 무접촉**으로 획득한다.
          #   `-sS` : `-s` 단독은 transport 실패에서도 stderr 0 바이트를 낸다(실측). `-S` 를
          #           더해야 진단이 표면에 실재한다. `2>/dev/null` 은 제거한다 — 그것이
          #           curl 자기 진단을 버리던 두 번째 침묵 축이다.
          #   `-w`  : 정확히 '%{http_code}' 만. `%{json}`·`%{header_json}` 은 자격증명·쿠키
          #           노출 표면이라 계약으로 금지한다. `-v`·`--trace*`·`-i`·`-D`·`-L` 도 금지.
          #   `--fail` 계열 미채택: exit code 를 바꿔 transport 실패와 HTTP 오류를 한 사유로
          #           병합해 버린다(AC-5 위반).
          CURL_RC=0
          HTTP_CODE=$(curl -sS -X GET \
            -w '%{http_code}' \
            -H "Authorization: Basic $(printf '%s:%s' "${ATLASSIAN_USER_EMAIL}" "${JIRA_READ_TOKEN}" | base64 -w0)" \
            -H "Accept: application/json" \
            "${JIRA_URL}" \
            -o comments_raw.json) || CURL_RC=$?

          # ── 분기 ② transport 실패 ────────────────────────────────────────────────
          # ★★ 판정 순서가 계약이다 — **`curl_rc` 를 먼저 본다.** transport 실패 시 `-w` 는
          #    `000` 을 내므로(실측: rc=6, `-o` 파일 미생성) `http_code` 를 먼저 분기하면
          #    전송 실패가 `http-error-000` 으로 붕괴해, 전송 실패가 HTTP 오류로 접힌다.
          #    그 붕괴가 정확히 AC-5 가 금지하는 실패 class 해상도 손실이다.
          if [[ "$CURL_RC" -ne 0 ]]; then
            echo "[branch-liveness-watchdog] ERROR: Jira fetch failed — transport 계층 (curl rc=${CURL_RC}, check connectivity/token scope)" >&2
            echo "[]" > comments.json
            # ★ `comments_file` 동반 방출 — 종전 이 분기만 이 키를 빠뜨려 하류가 빈 경로를
            #   받았다(AC-4 ③ 분기별 키 집합 동일성 위반). 보정한다.
            emit_observation "comments.json" "fetch-failed" "0" "fetch-error"
            exit 0
          fi

          # ── 분기 ③ HTTP 오류 (비-2xx) — 신설 ────────────────────────────────────
          # 응답은 도착했으나 2xx 가 아니다. 종전 구현은 이 경우를 **분기 자체가 없어**
          # 그대로 파싱으로 흘려보냈고, 오류 본문이 우연히 수집 컨테이너 형태이면
          # `(ok, 0, none)` — 즉 "관측했고 대상이 0건" 을 방출했다. 그것이 이 Story 가
          # 없애는 무신호 영점의 주 입구다. 404 는 "댓글 0건" 을 지지하지 못한다 —
          # Jira 가 404 를 "이슈 부재 **또는** 권한 없음" 으로 문서화하기 때문이다.
          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            case "$HTTP_CODE" in
              401|403) HTTP_REASON="http-error-auth" ;;
              404)     HTTP_REASON="http-error-not-found" ;;
              429)     HTTP_REASON="http-error-rate-limited" ;;
              5??)     HTTP_REASON="http-error-server" ;;
              # ★ 잔여 **전칭** — 위 넷에 배정되지 않은 비-2xx 전건(1xx · 3xx · 잔여 4xx).
              #   catch-all 을 「3xx + 잔여 4xx」로 열거하면 1xx 가 어느 bucket 에도 배정되지
              #   않아 bucket 집합이 자기 정의역(비-2xx)을 덮지 못한다.
              *)       HTTP_REASON="http-error-other" ;;
            esac
            echo "[branch-liveness-watchdog] ERROR: Jira HTTP ${HTTP_CODE} — '관측 0건' 으로 접지 않는다 (${HTTP_REASON})" >&2
            echo "[]" > comments.json
            emit_observation "comments.json" "http-error" "0" "${HTTP_REASON}"
            exit 0
          fi

          # comments_raw.json → {comments: [...]} → body 필드만 추출 → JSON array
          #
          # ★ P2-3 (CFP-2984) — silent-zero 자기모순 봉합.
          #   구 구현은 bare `except: json.dump([], sys.stdout)` 로 **모든** 파싱 실패를 빈 배열로
          #   접은 뒤 그대로 `fetch_status=ok` 를 찍었다. 그 결과 401 JSON 오류 바디 · HTML 오류
          #   페이지 · 잘린 응답이 전부 하류에서 `observation_state=observed` +
          #   `collected_count=0` + `unobserved_reason=none` 으로 방출된다 —
          #   즉 "**관측했고 대상이 0건**" 이라고 보고한다. 이는 AC-29 가 구별하려던 바로 그
          #   두 상태를 뒤섞는 것이고 AC-24(silent-zero 금지)와 정면 충돌한다.
          #   또한 `else: comments = []` 가 같은 구멍의 두 번째 입구였다 — Jira 오류 응답은
          #   `{"errorMessages": [...]}` 형태의 dict 라 'comments' 키가 없어 조용히 0건이 됐다.
          #   → 파싱 실패·예상 밖 payload 형태를 **별도 상태 `parse-degraded`** 로 분기한다.
          #   ★ exit code 무접촉 — ADR-164 §결정 4(secret-absent = dry-run, 실호출 0)가 세운
          #     graceful degrade(exit 0)를 역전하지 않는다. 본 분기도 exit 0 이며 가시성만
          #     추가한다(차단력 0).
          #   ★ CFP-2995 — 같은 블록이 이제 두 사실을 **추가로** 기록한다:
          #     (a) 수집 컨테이너 원소 중 예상 밖 형태로 **드롭된 건수**
          #     (c) 취득분이 전체량에 미치지 못하는가(**페이지 절단**)
          #     둘 다 파일이 아니라 `parse_meta.json` 으로 나가 본문 추출과 섞이지 않는다.
          PARSE_RC=0
          python3 -c "
          import json, sys
          data = json.load(open('comments_raw.json'))
          meta = {'dropped': 0, 'truncated': False, 'total': None, 'start_at': 0, 'total_known': False}
          if isinstance(data, dict) and 'comments' in data:
            comments = data['comments']
            total = data.get('total')
            start_at = data.get('startAt', 0)
            # bool 은 int 의 하위형이라 isinstance(x, int) 가 True/False 를 삼킨다 — 배제한다.
            if isinstance(total, int) and not isinstance(total, bool):
              if not (isinstance(start_at, int) and not isinstance(start_at, bool)):
                start_at = 0
              meta['total'] = total
              meta['start_at'] = start_at
              meta['total_known'] = True
              meta['truncated'] = (start_at + len(comments)) < total
          elif isinstance(data, list):
            comments = data
          else:
            raise ValueError('unexpected payload shape: %s (Jira 오류 응답 가능성)'
                             % type(data).__name__)
          bodies = [c.get('body', '') for c in comments if isinstance(c, dict)]
          meta['dropped'] = len(comments) - len(bodies)
          json.dump(meta, open('parse_meta.json', 'w'))
          json.dump(bodies, sys.stdout)
          " > comments.json 2>parse_err.txt || PARSE_RC=$?

          if [[ "$PARSE_RC" -ne 0 ]]; then
            echo "[branch-liveness-watchdog] ERROR: Jira 응답 파싱 실패 — '관측 0건' 으로 접지 않는다 (parse-degraded)" >&2
            # ★ 파싱 진단을 stderr 로 **중계**한다 — 여기서 버리면 세 번째 침묵 축이 된다.
            sed 's/^/[parse-error] /' parse_err.txt >&2 2>/dev/null || true
            echo "[]" > comments.json
            emit_observation "comments.json" "parse-degraded" "0" "parse-error"
            exit 0
          fi

          # ★ CFP-2995 — 위 블록이 남긴 두 사실을 읽는다. **읽기 자체가 실패하면 그것도
          #   '판정 불가' 이며 '관측 0' 으로 접지 않는다** (관측했는데 X ≠ 관측 못 함).
          META_RC=0
          META_LINE=$(python3 -c "
          import json
          m = json.load(open('parse_meta.json'))
          print('%d %s' % (int(m['dropped']), 'yes' if m['truncated'] else 'no'))
          ") || META_RC=$?
          if [[ "$META_RC" -ne 0 ]] || [[ ! "$META_LINE" =~ ^[0-9]+[[:space:]](yes|no)$ ]]; then
            echo "[branch-liveness-watchdog] ERROR: 수집 완전성 메타 판독 실패 — 수집량 판정이 서지 않는다 (count-unresolved)" >&2
            emit_observation "comments.json" "parse-degraded" "0" "count-unresolved"
            exit 0
          fi
          DROPPED_N="${META_LINE%% *}"
          TRUNCATED_N="${META_LINE##* }"

          # ── AC-2 형태① (a) 원소 무신호 드롭 ─────────────────────────────────────
          # 위 컴프리헨션의 `isinstance(c, dict)` 필터는 예상 밖 형태의 원소를 **아무 신호도
          # 없이** 버린다. 전부 비-dict 이면 수집량이 조용히 0 이 되고 그대로 `ok/0/none` 이
          # 방출된다 — 무신호 영점의 두 번째 입구다. 드롭이 1건이라도 있으면 보고된 수집량은
          # 관측 가능한 전체를 나타내지 않으므로 관측성공으로 계상하지 않는다.
          if [[ "$DROPPED_N" -gt 0 ]]; then
            echo "[branch-liveness-watchdog] ERROR: 수집 컨테이너 원소 ${DROPPED_N} 건이 예상 밖 형태로 드롭 — 보고 수집량이 전체를 나타내지 않는다 (element-shape-unexpected)" >&2
            emit_observation "comments.json" "parse-degraded" "0" "element-shape-unexpected"
            exit 0
          fi

          # ── AC-2 형태② (c) 부분관측 (페이지 절단) ───────────────────────────────
          # 취득분(startAt + 페이지 길이)이 응답이 신고한 전체량(total)에 미치지 못한다.
          # 종전에는 취득분을 그대로 전체로 보고했다 — silent partial-zero.
          # ★ 정직 천장: `total` 이 응답에 없거나 정수가 아니면 **절단을 관측하지 못한 것**이지
          #   "전체를 봤다" 가 아니다. 그 경우를 미관측으로 접지 않는 이유는 정상 응답
          #   `{"comments": []}` 가 그 형태이고 «관측된 진짜 0건» 을 보존해야 하기 때문이다
          #   (AC-3). 즉 본 검출의 커버리지는 «total 을 신고하는 응답» 까지이며, 그 밖은
          #   덮지 않는다 — 덮은 척하지 않는다.
          if [[ "$TRUNCATED_N" == "yes" ]]; then
            echo "[branch-liveness-watchdog] ERROR: 페이지 절단 — 취득분이 전체량에 미치지 못한다. 부분을 전체로 보고하지 않는다 (page-truncated)" >&2
            emit_observation "comments.json" "parse-degraded" "0" "page-truncated"
            exit 0
          fi

          # ── 분기 ⑤ ok — 실 수집 성공 ────────────────────────────────────────────
          # AC-29 (CFP-2984): 실 수집 성공 경로 — 실측 건수 + 사유 없음(none) 을 구조화 방출.
          #   이 경로의 count=0 은 "관측했는데 0 건"(observed) 이며 위 dry-run 의 "미관측"(unobserved) 과 다르다.
          # ★ CFP-2995 — 종전 `|| echo 0` OR-fallback 제거. 그 한 토막이 **산출 실패를
          #   '0 건' 이라는 관측치로 접어** 무신호 영점을 만들던 세 번째 입구였다
          #   (`2>/dev/null` 이 진단까지 함께 버렸다). 이제 실패는 사유와 함께 방출된다.
          COUNT_RC=0
          OBSERVED_COUNT=$(python3 -c "import json;print(len(json.load(open('comments.json'))))") || COUNT_RC=$?
          if [[ "$COUNT_RC" -ne 0 ]] || [[ ! "$OBSERVED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "[branch-liveness-watchdog] ERROR: 수집량 산출 실패 — '0 건' 으로 접지 않는다 (count-unresolved)" >&2
            emit_observation "comments.json" "parse-degraded" "0" "count-unresolved"
            exit 0
          fi
          emit_observation "comments.json" "ok" "${OBSERVED_COUNT}" "none"
          set -e

      - name: Restore watchdog state cache (durable cursor, cross-run persistence)
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-state
          key: branch-liveness-cursor-${{ github.run_id }}
          restore-keys: |
            branch-liveness-cursor-

      - name: Run branch liveness watchdog
        id: watchdog
        run: |
          set +e

          # Durable cursor (cross-run persistence via actions/cache)
          # actions/cache = ~7day eviction + branch-scoped restore. ≫ INV-L1 total-deadline(24h).
          # honest-ceiling: best-effort persistence. cache miss → fresh cursor (false-fresh 아님, 재추적 시작).
          mkdir -p .watchdog-state
          CURSOR_FILE=".watchdog-state/cursor.json"
          MARKER_FILE=".watchdog-state/marker.json"
          COMMENTS_FILE="${{ steps.fetch-comments.outputs.comments_file }}"

          # watchdog 실행
          bash scripts/check-branch-liveness.sh \
            --comments "${COMMENTS_FILE}" \
            --cursor "${CURSOR_FILE}" \
            --marker-out "${MARKER_FILE}" \
            --json \
            > verdict.json 2>&1 || true

          # verdict 파싱 (exit 0 이므로 always success)
          if [[ -f verdict.json ]]; then
            python3 -c "
          import json, sys
          try:
            with open('verdict.json') as f:
              v = json.load(f)
            print(json.dumps(v, indent=2))
          except:
            print('::error::watchdog verdict 파싱 실패')
            " >> verdict-formatted.txt 2>&1
          else
            echo "{}(watchdog 결과 없음)" > verdict-formatted.txt
          fi

          set -e

      - name: Surface verdict to GitHub STEP_SUMMARY
        if: always()
        run: |
          set +e

          echo "## Branch Liveness Watchdog" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Fetch status:** ${{ steps.fetch-comments.outputs.fetch_status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f verdict.json ]]; then
            python3 -c "
          import json
          try:
            with open('verdict.json') as f:
              v = json.load(f)
            print(f\"Verdict: **{v.get('verdict', '?')}**\")
            summary = v.get('summary', {})
            print(f\"  - Fresh: {summary.get('fresh', 0)}\")
            print(f\"  - Stalled: {summary.get('stalled', 0)}\")
            print(f\"  - Unknown: {summary.get('unknown', 0)}\")
            branches = v.get('branches', {})
            if branches:
              print(\"\")
              print(\"### Per-branch Status\")
              for br in sorted(branches.keys()):
                b = branches[br]
                print(f\"- **{br}**: {b.get('verdict', '?')} ({b.get('reason', '?')})\")
          except Exception as e:
            print(f\"Parse error: {e}\")
            " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Parse error" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No verdict generated (check logs)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note:** Watchdog runs every 15 minutes (GH cron 5min floor + jitter)." >> "$GITHUB_STEP_SUMMARY"
          echo "Meta-observer (Tier 2) marker file absence >2× cron = alarm signal." >> "$GITHUB_STEP_SUMMARY"
          # ★ CFP-2995 — 이 표면 자신의 사각지대를 적는다. 침묵을 주제로 하는
          #   변경이 자기 사각지대에 침묵하면 그 침묵이 곳 결함이다.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 이 표면은 실행된 run 만 기술한다 — 실행되지 않았거나 취소된 tick 은 여기 나타나지 않는다." >> "$GITHUB_STEP_SUMMARY"

          set -e

      - name: Emit structured observation state (AC-29 — 수집 0 사실·사유 가시화)
        id: observation
        if: always()
        env:
          FETCH_STATUS: ${{ steps.fetch-comments.outputs.fetch_status }}
          RAW_COLLECTED_COUNT: ${{ steps.fetch-comments.outputs.collected_count }}
          RAW_UNOBSERVED_REASON: ${{ steps.fetch-comments.outputs.unobserved_reason }}
        run: |
          set +e
          # ── AC-29 (CFP-2984) 구조화 가시화 ──────────────────────────────────────────
          # 목적: 후속 조회가 "관측됨 0"(observed, count=0) 과 "미관측"(unobserved) 을 구별.
          # exit code 무접촉 — ADR-164 §결정 4(secret-absent = dry-run, 실호출 0)가 세운
          #   graceful degrade(exit 0)를 역전하지 않는다. 본 step 은 가시성만 추가한다(차단력 0).
          # 판정축 재사용: observation_state enum 신설 0 — fetch_status 4-enum(ok / dry-run /
          #   fetch-failed / parse-degraded)에서 기존 2-enum(observed / unobserved)을 파생한다.
          #   ★ parse-degraded 는 P2-3 봉합으로 추가된 fetch_status 값이며 unobserved 로 접힌다
          #     — 파싱이 깨진 응답은 "관측했고 0건" 이 아니라 "관측하지 못함" 이다.
          # vacuous 3형태 정규화: 빈 문자열 / null / unknown 은 전부 "값 없음" 으로 접는다
          #   — 셋 중 아무거나로 사유를 적어도 "사유 가시화" 로 계상되지 않게 하기 위함.
          norm_vacuous() {
            local v
            v="$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            case "$v" in
              ""|null|nil|none-specified|unspecified|unknown|n/a|na|-) printf '' ;;
              *) printf '%s' "$v" ;;
            esac
          }

          FETCH_STATUS_N="$(norm_vacuous "${FETCH_STATUS:-}")"
          REASON_N="$(norm_vacuous "${RAW_UNOBSERVED_REASON:-}")"
          COUNT_N="$(printf '%s' "${RAW_COLLECTED_COUNT:-}" | tr -cd '0-9')"

          case "$FETCH_STATUS_N" in
            ok)
              OBS_STATE="observed"
              [ -n "$COUNT_N" ] || COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="none"
              ;;
            dry-run)
              OBS_STATE="unobserved"
              COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="credential-absent"
              ;;
            fetch-failed)
              OBS_STATE="unobserved"
              COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="fetch-error"
              ;;
            http-error)
              # ★ CFP-2995 — 응답은 왔으나 2xx 가 아니다. 닫힌 case 의 catch-all `*)` 가
              #   fail-closed 로 접긴 하지만 그 경로는 사유를 `fetch-status-missing` 으로
              #   뭉개서 HTTP 오류의 해상도를 잎는다 — 그래서 arm 을 동반 추가한다.
              OBS_STATE="unobserved"
              COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="http-error-other"
              ;;
            parse-degraded)
              # P2-3: 응답은 왔으나 파싱이 깨졌다. count=0 은 "대상이 0건" 이 아니라
              #   "세어 볼 수 없었다" 이므로 observed 로 접지 않는다.
              OBS_STATE="unobserved"
              COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="parse-error"
              ;;
            *)
              # fetch step 자체가 status 를 못 남긴 경우도 "미관측" 이며 그 사유를 명시한다.
              OBS_STATE="unobserved"
              COUNT_N=0
              [ -n "$REASON_N" ] || REASON_N="fetch-status-missing"
              ;;
          esac

          # 구조화 필드 방출 (후속 조회 표면 ①: step output)
          {
            echo "observation_state=${OBS_STATE}"
            echo "collected_count=${COUNT_N}"
            echo "unobserved_reason=${REASON_N}"
          } >> "${GITHUB_OUTPUT:-/dev/null}"

          # 구조화 필드 방출 (후속 조회 표면 ②: durable STEP_SUMMARY 블록)
          {
            echo ""
            echo "### Observation state (AC-29 구조화 가시화)"
            echo ""
            echo '```'
            echo "observation_state: ${OBS_STATE}"
            echo "collected_count: ${COUNT_N}"
            echo "unobserved_reason: ${REASON_N}"
            echo "fetch_status: ${FETCH_STATUS_N:-fetch-status-missing}"
            echo '```'
            echo ""
            echo "> \`observed\` + \`collected_count: 0\` = 관측했고 대상이 0건."
            echo "> \`unobserved\` = 관측 자체가 없었음 — 사유는 \`unobserved_reason\` 참조."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          echo "[branch-liveness-watchdog] observation_state=${OBS_STATE} collected_count=${COUNT_N} unobserved_reason=${REASON_N}" >&2
          set -e

      - name: Save watchdog state cache (durable cursor persistence for next run)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .watchdog-state
          key: branch-liveness-cursor-${{ github.run_id }}

      - name: Check honest-degrade on fetch failure
        if: steps.fetch-comments.outputs.fetch_status == 'fetch-failed' || steps.fetch-comments.outputs.fetch_status == 'dry-run' || steps.fetch-comments.outputs.fetch_status == 'parse-degraded' || steps.fetch-comments.outputs.fetch_status == 'http-error'
        run: |
          echo "[branch-liveness-watchdog] watchdog running in dry-run / degraded mode (non-blocking)" >&2
          echo "::notice::Jira fetch failed or secrets absent — watchdog is in dry-run. Verdict surfaced to STEP_SUMMARY." >&2
