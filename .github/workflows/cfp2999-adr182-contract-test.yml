name: cfp2999 ADR-182 contract test

# CFP-2999 구현리뷰 iter1 F-CR1-02 정산 — 신규 16 테스트의 CI 실행 채널 0 (존재≠실행).
# 이 repo 의 silent-un-run 봉인 게이트(check_selftest_execution_liveness.py)는 정의역이
# `tests/scripts/*.sh` 라 `tests/*.py` 를 원리적으로 못 잡는다 → 전용 workflow 로 배선.
# day-1 hard-fail · non-required (branch protection 8-tuple 무접촉 — INV-4·ADR-125 존중).

on:
  pull_request:
    paths:
      - "archive/adr/ADR-182-*.md"
      - "tests/test_adr182_*.py"
      - ".github/workflows/cfp2999-adr182-contract-test.yml"
  push:
    branches: [main]
    paths:
      - "archive/adr/ADR-182-*.md"
      - "tests/test_adr182_*.py"
      - ".github/workflows/cfp2999-adr182-contract-test.yml"

# 형제 게이트 workflow(cfp2949-scheduled-task-test 등)와 같은 최소 권한.
# 이 스위트는 체크아웃된 작업트리 파일만 읽는다 — GitHub API 호출 step 이 없어
# `contents: read` 를 넘길 근거가 없다. job-level 블록은 상위가 넓어져도 이 job 이
# 읽기로 남게 하는 이중 좁힘이라 남긴다.
permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'mclayer/plugin-codeforge'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        # fetch-depth 기본(shallow) 유지 — 본 스위트는 작업트리의 ADR-182 문면과
        # scripts/lib/ac_id.py 만 읽는다. git 이력을 실측하는 step 이 없어 형제
        # workflow 의 `fetch-depth: 0` 를 복사할 근거가 없다.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run ADR-182 contract tests
        # 가드 2 (Story guard) 는 CFP2999_STORY_PATH 미주입 → 정직 skip.
        # Story 파일은 internal-docs repo 소재 (wrapper CI 비가시) — 상시 배선은
        # 후속 배선 Story (ADR-182 §편입 지시 5항).
        run: |
          python -m pytest \
            tests/test_adr182_review_domain_separation_contract.py \
            -v -ra
