name: disjoint-axis-whitelist-lint
# CFP-2572 Phase 2 (원 도입) / CFP-2869 Phase 2 (ADR-039→ADR-170 재제정 대응 재지향) /
#   ADR-142 §결정 3 — ADR-170 inline-whitelist static-integrity lint.
#
# Tier: [물리강제 — ADR-integrity 정적, 유일 물리강제]. 본 게이트는 ADR STATIC INTEGRITY 만
#   단언한다 (behavior/runtime 강제 아님):
#     (C0) lint 대상 ADR frontmatter `status` 가 Superseded 계열이 아님 — 재제정으로 동결된 구본을
#          대상에 남긴 배선 오류가 영구-PASS hollow-gate 로 굳는 것을 차단 (ADR-170 재제정 lineage)
#     (C1) declared-vs-actual self-consistency — ADR-170 §결정 2 정형 선언 라인의 declared count 가
#          같은 절 flat 단일표의 실 entry row 수(actual)와 일치. 기대 count 상수 pin 폐기:
#          기대값을 workflow·lint 에 복제하면 ADR 갱신 시 stale drift 를 재생산하므로
#          (CFP-2850 entry 7 추가 시 미동조 실적) 문서 내부 self-consistency 로 판정한다 —
#          8번째 entry 신설 시 본 게이트 무접촉.
#     (C2) return-envelope-v1.md 'disjoint axis' 선언 존재 (ADR-170 §결정 2 무침범)
#     (C3) return-envelope-v1.md self-claim(inline-whitelist entry 자칭) 부재 — 긍정 copula 한정
#          (부정 어미 자연 문구 오탐 0)
#   §결정 2 절 경계(`### 결정 2(?![0-9])`→`### 결정 3(?![0-9])`) 밖을 계상하는 구현은 BORN-BROKEN
#   (CFP-2530/2527/2535 self-defeating lineage) — 자매 discriminating test 가 mutation 으로 검출.
#
# single-root (.github only): governance registry(ADR/L-doc) 정합 검사라 .github-only 정합
#   (templates/github-workflows mirror 미운용 — spawn-event-schema-lint 동형). ADR-005 byte-parity
#   scope 외. invariant-check.yml parity loop 은 templates → .github 방향이라 .github-only 파일 미검출.
#
# Non-required workflow (branch protection required contexts 무변경, merge 미차단). warning-tier: lint job 은
#   위반 검출 시 경고 표시하되 continue-on-error 로 job 성공(비차단). discriminating test job 은
#   continue-on-error 없음 (회귀 시 exit 1 차단 — ADR-136 execution-liveness).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  disjoint-axis-whitelist-lint:
    name: disjoint-axis-whitelist static-integrity lint (warning-tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check-disjoint-axis-whitelist.sh (warning, 비차단)
        continue-on-error: true
        run: bash scripts/check-disjoint-axis-whitelist.sh check

  disjoint-axis-whitelist-test:
    name: discriminating test (C0~C3 / M1~M9 — mutation 생존 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test-check-disjoint-axis-whitelist.sh (회귀 시 exit 1 차단)
        run: bash scripts/test-check-disjoint-axis-whitelist.sh
