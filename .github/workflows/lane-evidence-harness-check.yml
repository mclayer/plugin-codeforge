name: lane-evidence-harness-check

# CFP-2270 — check-lane-evidence.sh §14 면제 분기 (ADR-031 Amendment 2) TDD harness.
# wrapper-self CI 검사 (consumer 배포 대상 아님 — templates/github-workflows/ parity 불요,
# doc-locations-check.yml / consumer-scripts-manifest.yml 와 동일 계열의 wrapper-self check).

on:
  pull_request:
    paths:
      - 'scripts/check-lane-evidence.sh'
      - 'scripts/test-check-lane-evidence.sh'
      - 'tests/scripts/test_cfp2914_peer_codispatch.py'
      - 'tests/scripts/test_cfp2914_diagnostic.py'
      - 'tests/scripts/test_cfp2914_surfaces.py'
      - 'tests/fixtures/cfp2914/**'
      - 'templates/scripts/detect-repo-kind.py'
      - '.github/workflows/lane-evidence-harness-check.yml'
      - 'requirements.txt'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test deps (pytest 러너 의존 provisioning)
        # requirements.txt = pytest + pytest-timeout. test-check-lane-evidence.sh 는 pytest 러너
        # 의존 → setup-python 뒤·pytest 앞 선행 설치(부재 시 ModuleNotFoundError born-red 회피).
        run: pip install --quiet -r requirements.txt
      - name: Run lane-evidence §14 면제 harness
        run: bash scripts/test-check-lane-evidence.sh
