name: dev-process-schema-parity
# CFP-2985 D-11c / ADR-181 §결정 3 — `dev-process-event-v1` 계약 §2 표 <-> `_ROW_KEYS` 원자성의
#   **실 강제자**. Security: third-party actions are SHA-pinned per CFP-300 policy.
#
# 왜 필요한가 (dead-gate 소생):
#   계약 §2 index schema table 과 `scripts/lib/append_dev_process_event.py` 의 `_ROW_KEYS` 는
#   doc↔code parity SSOT 로 선언돼 있으나, 그 원자성을 **실제로 재는 주체가 CI 에 0** 이었다.
#   즉 "동일 커밋에 옮긴다" 는 저작 규율일 뿐 강제가 아니었다(Change Plan §3.2 제약 1 표).
#   본 workflow 가 그 강제자다.
#
# ★ 배선 대상 3종은 **신규 저작이 아니라 소생**이다 (Change Plan D-11c — 전건 기존 자산):
#   a) tests/scripts/test_dev_process_schema_gate_wrappers.py  — 기존 9 test, 실행 workflow 0 이었음
#   b) scripts/lib/append_dev_process_event.py --self-test     — `_ROW_KEYS` 길이 하드 assert 발화 경로
#   c) tests/unit/test_dev_process_ship_time_parity.py         — ★ 계약 §2 표를 파싱해 `_ROW_KEYS` 와
#      대조하는 **repo 유일의 doc↔code parity 측정기**. dead 판정 3채널 전건 확인분
#      (이름 인용 0 / tests/unit glob 러너의 `-k` 필터가 제외 / lint.yml 수집 정의역 밖).
#      D-11c 의 목적이 바로 그 원자성 강제인데 **그것을 재는 테스트가 이미 있으면서 죽어 있었다.**
#
# §8.C 이행: C-1 실행 run 줄 / C-2 의존성 설치 step / C-3 continue-on-error 부재 /
#            C-4 paths·paths-ignore 부재 ∧ job `if:` 부재 / C-5 수집 테스트 수 non-zero
# ★ **day-1 hard-fail** — 본 workflow 는 warning tier 가 아니다. parity 위반 = job red.
#   (admission 게이트[fix-ledger-conformance.yml]의 warning-first 와 다른 축이다: 이쪽은
#    "새 규범의 입장료" 가 아니라 **기존 계약의 자기정합**이므로 유예 근거가 없다.)
# **non-required**: branch protection contexts 무변경 (required context 신설 0).
#
# ★★ **CP 문면과의 divergence (`declared`)** — Change Plan §5 D-11c 는 배선 대상을
#   `.github/workflows/` **+ twin `templates/github-workflows/`** 로 적었으나, 본 착지는
#   **`.github`-only** 다 (twin 미보유). 이탈 근거 3항 (firsthand):
#   ⓐ 위 3 run 줄이 참조하는 `tests/scripts/**` · `tests/unit/**` 는 **wrapper 전용 경로**다.
#      templates/ twin 은 consumer 로 복사되는 seed 인데, consumer repo 에는 그 경로가 없으므로
#      복사 즉시 **born-red** 가 된다. 선언만 하고 성립하지 않는 게이트를 출하하는 것은
#      본 Story 가 표적으로 삼는 결함 계보(ADR-181 검증 정의역 결손) 그 자체다.
#   ⓑ repo 관례에 **선례가 실재**한다 — 순수 self-test workflow 는 `.github`-only 로 둔다.
#      firsthand 계수: twin 없는 `.github/workflows/*.yml` = **50개**. 동종 예 =
#      `evidence-registry-check-test.yml` · `dev-process-metrics-test.yml`(동일 도메인) ·
#      `selftest-execution-liveness-test.yml` · `cfp2985-rtm-contract-test.yml`.
#   ⓒ `invariant-check.yml` 의 Workflow parity loop 은 `templates/github-workflows/*.yml` 를
#      walk 하는 **단방향**이라 `.github`-only 파일을 미검출한다. 역방향 기전인
#      `CONSUMER_ONLY_WORKFLOWS` 는 "twin 은 있고 self-app copy 는 면제" 를 담는 목록이므로
#      **wrapper-only 를 담지 못한다** — 즉 등재로는 ⓐ 를 해소할 수 없다.
#   ⇒ 처분 = twin 제거, `.github`-only 유지. **이는 CP 문면 이탈이며 은폐가 아니라 선언이다.**
#      CP §5 D-11c 행의 "+ **twin** `templates/github-workflows/`" 문면 정정 = Phase 2 마감 편집 대상.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dev-process-schema-parity:
    name: dev-process-schema-parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies (C-2)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest pyyaml
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: Primitive self-test — _ROW_KEYS hard anchor (C-1)
        run: |
          python3 scripts/lib/append_dev_process_event.py --self-test

      - name: Schema gate wrappers (C-1, C-5)
        run: |
          python3 -m pytest -v tests/scripts/test_dev_process_schema_gate_wrappers.py

      - name: doc-to-code parity measurer (C-1, C-5) — contract section 2 table vs _ROW_KEYS
        run: |
          python3 -m pytest -v tests/unit/test_dev_process_ship_time_parity.py
