name: story-read-surface-test
# CFP-2986 Phase 2 / Change Plan §8.1 RTM (normative AC 15건) + §8.2 mutant 배터리 —
#   Story 성장축 외부화 게이트(scripts/lib/check_story_read_surface.py)의 명명 테스트와
#   discriminating mutant 배터리를 실 CI red/green 으로 산출한다.
# Security: third-party actions are SHA-pinned per CFP-300 policy.
#
# 왜 필요한가 (**존재 ≠ 실행** — 본 repo 상습 형상):
#   tests/ 에는 blanket 수집이 없고 workflow 가 파일을 **이름으로 지목**해야 실행된다.
#   실측(본 브랜치 기준): tests/scripts/*.py 55개 중 39개가 실행 workflow 0 이다.
#   그리고 ac-traceability Hop3 는 `ast.FunctionDef` **심볼 존재**만 확인하므로
#   dead test 위에서도 RTM 이 GREEN 이 될 수 있다 — 실제로 CFP-2976 P0 pytest 3종이
#   실행 workflow 0 인 사고가 있었다. 본 workflow 가 그 경로를 닫는다.
#
# **day-1 hard-fail** (continue-on-error 금지) — self-test 실패 = job red.
# **non-required** (branch-protection 8-tuple 무변경 — 신규 required context 0).
#
#   ★ 승격 사전조건 = ADR-180 「해소 기준」 **4건 전건 AND**. 넷이 **전부** 충족되고
#     별도 carrier 가 승격을 명시 결정해야 유효하며, 하나라도 미충족이면 승격 금지다.
#     (종전 이 헤더는 4번만 인용해 **1/4 만 노출**했다. 그 상태로 승격하면 2·3번 미충족이
#      그대로 required 로 올라가 게이트 축이 상시 비-GREEN 이 된다.)
#
#     1. internal-docs open PR **CONFLICTING 8건** 정리 — 충돌 PR 은 merge ref 부재로
#        workflow 가 아예 안 돌아 required 가 영구 Pending (ADR-180 §결정 6)
#     2. **O5 `scanned_count` 3항** 충족 — 분할 자식 경로 fixture 에 대해 (a) workflow 기동
#        (b) 실제 스캔 대상 포함 (c) 트리거 매치 집합 == 검사 매치 집합 을 **따로** assert
#        (Change Plan §7.4a — 미충족 = 승격 금지)
#     3. 정량 레지스트리 **전 정의역 `status: enforced` 전환** — `deferred` 잔존분의
#        방출값은 GREEN 이 아니라 `UNDETERMINED` 다 (ADR-180 §결정 4 registry shape)
#     4. ADR-171 §결정 6 **3-AND** 승격 게이트 + ADR-130 §결정 6 **7일-green 창**(repository
#        단위) 충족 — 승격은 자동이 아니며 이를 측정·집행하는 코드는 현재 0건이다 (§결정 6)
#
#   ★ 승격은 "이 파일에서 한 줄 지우기" 가 아니다 — 본 workflow 에는 tier 를 낮추는 스위치가
#     없다(continue-on-error 0). 승격 = branch protection `required_status_checks.contexts`
#     에 job name 을 **등재**하는 repo 설정 행위이며 Orchestrator post-merge 소관이다.
#
# **정직 상한 — 게이트 본체(rc 축)는 아직 CI 에 배선돼 있지 않다** (위 해소 기준 3 미충족):
#   본 workflow 가 돌리는 것은 **pytest 자기검증 2종**이지 게이트 판정(rc)이 아니다.
#   `scripts/check-story-read-surface.sh` 를 호출하는 workflow 는 **현재 0건**이다
#   [실측 wrapper `a3d7c56bb`: `.github/` 전역에서 `check-story-read-surface` 매치 0].
#   게이트를 정본 코퍼스에 직접 돌리면 **rc=3(UNDETERMINED)** 이 나온다
#   [firsthand 2026-08-16: 엔진 wrapper `a3d7c56bb` × 코퍼스 internal-docs `8f317f7ce`
#    → `scanned_count=3 violations=0 deferred=6`, rc=3. 내역 = SELF/BASE/AUTHOR/LEGC
#    4정의역 `status: deferred`(해소 기준 3) 4건 + `--before-ref` 부재 INV-S1/S2 2건].
#   ⇒ **게이트 축은 지금 상태로 승격하면 7일-green 창을 구조적으로 채울 수 없다.** rc=3 은
#     GREEN 이 아니고(설계 의도대로다) 이를 GREEN 으로 뭉개는 완화는 금지다. 해소 경로는
#     하나 — 위 **해소 기준 3**(전 정의역 `enforced` 실체화)이며 본 Story 범위 밖이다
#     (설계 결정 사항 — 구현 lane 이 자체 확장하지 않는다).
#   본 workflow(pytest 축) 자신은 별개이고 green 이다 — 최근 실행 conclusion=**success**
#   [실측: wrapper run `31940770806`, job `story-read-surface-test`, branch `cfp-2986-phase2`].
#
# ─────────────────────────────────────────────────────────────────────────────
# ★ post-merge 필수 후속 = **pin bump ∧ 실행 사본 재착지** (둘의 연접, 택일 아님)
#   (담당: Orchestrator, merge 직후 같은 세션)
# ─────────────────────────────────────────────────────────────────────────────
#  ① 언제    본 PR(wrapper #2997)과 짝 PR(internal-docs #3029)이 **squash-merge 된 직후**.
#            squash 는 새 커밋 1개를 만들고 head 브랜치를 삭제하므로, 브랜치에만 있던 커밋
#            SHA 는 그 시점부터 **도달 불가**가 된다.
#
#  ② 불변식  게이트(internal-docs `scripts/lib/compare_story_read_surface_parity.py`)는
#            `WRAPPER_PINNED_REF` 가 가리키는 **wrapper 커밋의 3 target 바이트**를 urlopen 으로
#            받아 **internal-docs 로컬 3 target 바이트**와 대조한다. 성립해야 할 등식은
#              raw(wrapper @ WRAPPER_PINNED_REF)  ==  local(internal-docs)   [3 target 전건]
#            한쪽만 움직이면 등식이 깨진다 ⇒ 후속은 **연접(∧)이지 선택(∨)이 아니다**.
#            반사실 [구현리뷰 라운드 2 firsthand]:
#              pin 미bump  → 브랜치 삭제로 pinned SHA 가 404          → **rc=1**
#              pin 만 bump → raw(새 커밋) ≠ local(구 사본) drift      → **rc=1**
#              둘 다(연접) → 3 target 바이트 일치                     → **rc=0**
#
#  ③ 대상    아래가 전수다 — 정의역 = **wrapper 트리 ∪ internal-docs 트리**.
#            ★ 종전 이 표는 정의역이 wrapper 단독이라, 실제로 fetch 되는 **유일한 pin**(A-1)을
#              통째로 배제했다. A-1 은 다른 pin 과 달리 주석 provenance 가 아니라 **실 fetch
#              대상**이며, 미bump 의 결과도 인용 소실이 아니라 **게이트 rc=1 차단**이다.
#            [도달성 = `git merge-base --is-ancestor <sha> origin/main` 전건 firsthand 재판정.
#             기준: wrapper origin/main `4b30b860`, internal-docs origin/main `abc3bda8`]
#
#   [A 계열] pin 값이 가리키는 곳 = **wrapper** 커밋 / pin 이 놓인 곳 = internal-docs
#     A-1  internal-docs  scripts/lib/compare_story_read_surface_parity.py:82
#                         (`WRAPPER_PINNED_REF` — 줄번호보다 **심볼명이 정본**. 주석 증감으로
#                          줄이 밀린 전례가 본 Story 에 있다: `:75`→`:82`)
#                         ★**실 fetch(urlopen) 대상**            도달성 ✗ (wrapper 브랜치 전용)
#     A-2  internal-docs  .github/workflows/story-read-surface-check.yml:261
#                         A-1 과 동값 인용 mirror (주석 축)       도달성 ✗ (동상)
#     ⇒ 새 값 = **wrapper #2997** squash-merge 커밋 SHA (A-1 은 40자 그대로 / A-2 는 앞 12자)
#        `gh pr view 2997 --repo mclayer/plugin-codeforge --json mergeCommit`
#     ⇒ 미이행: A-1 = **rc=1, 전 PR 차단**(fail-closed 실동작) / A-2 = 인용 근거 소실만.
#
#   [A-frozen] **무조치 — 동결 감사 기록**(bump 하면 안 되는 site. 정직 고지)
#     internal-docs `wrapper/stories/CFP-2986-S1.md:1205,:1230` (§9.13 구현리뷰 R2 verdict)
#       = 리뷰어가 **그 시점에 관측한 값** `c9f8670fd…` 의 기록이다. 링크 생존을 위해 갱신하면
#         "무엇이 관측됐는가" 를 위조하게 된다 ⇒ post-merge 도달 불가(dangling)를 **감수**한다.
#       ※ §9 는 Orchestrator 독점면이라 구현 lane 이 편집 대상으로 삼지도 않는다.
#       ※ 전수 재계수 결과 2곳이다(1곳 아님) — 정의역 = internal-docs tracked 전건 `git grep`.
#
#   [B 계열] pin 값이 가리키는 곳 = **internal-docs** 커밋 `a1888a93` / 놓인 곳 = 양 repo
#     B-1   wrapper        scripts/lib/check_story_read_surface.py:62,66   도달성 ✗ (브랜치 전용)
#     B-1'  internal-docs  같은 파일·같은 줄의 **byte-identical 실행 사본**  도달성 ✗ (동상)
#     ⇒ 새 값 = **internal-docs #3029** squash-merge 커밋 SHA 의 **앞 8자**
#        `gh pr view 3029 --repo mclayer/codeforge-internal-docs --json mergeCommit`
#     ⇒ 미이행(둘 다 그대로 둠): **게이트 rc 는 바뀌지 않는다.** 엔진은 이 SHA 를 fetch 하지
#        않고(주석 문면일 뿐) 코퍼스는 `--after-ref`(기본 HEAD)로만 읽는다
#        [실측: `git_archive_text(repo_root, after_ref, path)` — baseline_tree_sha 는 출력 라벨
#         전용. 코퍼스 HEAD `8f317f7ce` ≠ baseline `7d075514` 인 채 정상 실행됨].
#        ⇒ "404 → rc=1 fail-closed 로 전 PR 차단" 은 **B 계열에 한해 성립하지 않는다**(A-1 은
#          정반대로 성립한다). B 계열 실 손상은 차단이 아니라 인용 근거의 영구 소실
#          — **dangling provenance(검증 불가)**. 과장 금지(ADR-119).
#     ⇒ ★ 단 **한쪽만 고치면 rc=1** 이다: B-1 은 parity 3 target 안에 있으므로 wrapper 만
#          bump 하고 그 커밋으로 pin 을 올리면 ②의 등식이 깨진다. B 계열은 양 repo 동시 편집.
#
#   [C 계열] main 조상이라 **무조치** (도달성 ✓ — 브랜치 삭제와 무관)
#     C-1  wrapper + 사본  scripts/lib/check_story_read_surface.py:62,69,1228   7d075514
#     C-2  wrapper + 사본  docs/story-read-surface-baseline.yaml:18,48          7d0755140c…
#     C-3  wrapper + 사본  docs/story-read-declaration-registry.yaml:26         a0c84e66d2… (wrapper #2992)
#     C-4  wrapper 단독    templates/story-page-structure.md:784                7d075514
#     ※ 정의역 밖 1건 정직 고지: `templates/story-page-structure.md:248` 의 `abcd92bf` 는
#       ADR-014 인용으로 본 PR 쌍이 도입한 pin 이 아니다(도달성 ✓ 확인, 무조치).
#
#  ④ 실행 사본 재착지 — parity 3 target 을 wrapper SSOT 로 **byte-identical** 재동기화한다:
#       scripts/lib/check_story_read_surface.py · docs/story-read-surface-baseline.yaml
#       · docs/story-read-declaration-registry.yaml
#     (구현리뷰 라운드 2 FIX 의 실 root cause = 정확히 이 3건의 사본 미전파였다. 사본 일치는
#      squash 스냅샷으로 자동 성립한다고 **가정하지 말고 실행으로 확인**한다 — 그 미확인 가정이
#      라운드 2 를 만들었다.)
#
#  ⑤ 순서·검증  pin 은 사본보다 **뒤**에 확정한다 (pin 선행 = 반드시 stale).
#     1) wrapper: B-1 bump 커밋 push ⇒ wrapper main 새 SHA = W2
#        (B 계열을 손대지 않기로 하면 이 단계 생략, W2 = #2997 merge 커밋)
#     2) internal-docs: B-1' 동일 bump ∧ A-1 = W2 ∧ A-2 = W2 를 **한 커밋**으로
#     3) internal-docs 에서 게이트를 실제로 돌려 **rc=0 을 실측**한 뒤에만 완료 단언
#        (rc 는 추론 대상이 아니다 — 실행 후 단언, ADR-119)
#
# **wrapper-self-only**: repo-guard `if: github.repository == 'mclayer/plugin-codeforge'`
#   (consumer 는 tests/scripts/** 부재 → job skip = inert). ac-traceability-self-test.yml /
#   cfp2701-story-form-parser-contract-test.yml 선례 답습.
# **unmirrored** (templates/github-workflows/ 미배치): invariant-check parity 는
#   templates→.github 단방향이라 template counterpart 부재 워크플로는 검사 대상 밖.
#
# git 의존: 매체 규약 테스트(`test_gate_uses_archive_not_worktree`)가 `git archive` 를
#   subprocess 로 실행해 LF 고정(raw CR = 0)을 실측한다 ⇒ `fetch-depth: 0` 불요하나
#   .git 디렉터리는 필요하므로 checkout 기본 동작(shallow clone + .git 보유)으로 충분하다.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-read-surface-test:
    name: story-read-surface-test
    if: github.repository == 'mclayer/plugin-codeforge'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test deps (pytest + pyyaml)
        run: pip install --quiet -r requirements.txt

      - name: Run pytest §8.1 RTM named-test suite (AC-1..AC-21 — Hop3 실 def resolve, day-1 hard-fail)
        run: python3 -m pytest tests/scripts/test_story_read_surface.py -q

      - name: Run pytest §8.2 mutant 배터리 (-s = 5-tuple construction 레코드를 CI 로그에 인쇄)
        run: python3 -m pytest tests/scripts/test_story_read_surface_mutants.py -q -s
