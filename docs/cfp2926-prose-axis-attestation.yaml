# CFP-2926 / AC-5 (NG-2) — fan-out 주체 문면 축 수동 attestation.
#
# 소비자 = scripts/lib/check_fanout_subject_prose.py.
# 스캐너가 주어 축을 자동 분류하지 못한(`unknown`) site 만 여기에 수동 분류한다.
# ★여기 없는 불명 site 는 스캐너가 INCONCLUSIVE 를 낸다 — 자동 GREEN 흡수 0.★
#
# 규약:
#   - `anchor` 는 그 줄의 **verbatim 부분문자열**이다. ★줄번호 금지★ — 인접 줄 편집으로
#     번호가 밀려도 앵커는 살아있어야 한다.
#   - attestation 은 **자기신고**다. 진위는 기계 검사 불가(리뷰 판정 축). 단 스캐너가
#     `pl` 로 자동 분류한 site 를 `preserve` 로 신고하는 whitelist 남용은 기계 거부된다
#     (`attestation_cannot_whitelist_pl_axis`).
#   - axis 값 공간: worker | teammate | team | pl | agent_specific | not_applicable
#   - disposition 값 공간: preserve | remove
#
# 축 분포 (본 파일): worker 9 / agent_specific 5 / not_applicable 1 = 15.

