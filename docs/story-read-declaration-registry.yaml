# CFP-2986 / ADR-180 §결정 1·8 — lane → 섹션 읽기 선언 레지스트리
#
# 무엇인가: `read_cost` 술어의 **정의역**이다 (부속물이 아니다).
#   read_cost(story) = Σ_{r ∈ readers} [ bytes(parent) + Σ_{c : opens(r,c)} bytes(c) ]
#   opens(r,c) ⟺ r 이 본 레지스트리 미등재 (보수 default — 전 자식 계상)
#                ∨ declares(r) ∩ carries(c) ≠ ∅
#
# 보수 default 의 방향성: 미등재 reader 는 **모든 자식을 여는 것**으로 계상한다.
#   ⇒ 레지스트리 불완전은 비용을 과대 계상할 뿐 절대 과소 계상하지 않으며,
#     따라서 불완전성이 거짓 "개선" 판정을 만들 수 없다 (fail-safe 모델링 default).
#   같은 이유로 각 행의 `declares` 는 **과소 선언이 위험하고 과대 선언이 안전**하다.
#
# ★ 정직 상한 (ADR-180 §결정 1): 이것은 **선언된** 읽기 비용이다.
#   `Read` 도구에 섹션 주소지정·집행면이 없어 선언과 실제 agent 거동의 일치는 기계 검증 불가 —
#   **attested, not verified**. "실제 읽기량을 잰다" 고 주장하지 않는다.
#
# 행별 `source` 인용 의무 (Change Plan §3.1). 인용 = wrapper repo 경로:줄 (아래 provenance 기준).
# `carries(c)` 는 본 파일이 아니라 **자식 frontmatter `carries_sections`** 가 선언하며,
#   게이트가 실행 시점에 파싱해 주입한다 (선언 파싱이지 슬라이싱이 아니다).

