    span_kind: line                            # 산문 한 줄 — 표 아님 (전역 규칙 born-broken 지점)
    span_anchor: '^\*\*수용 기준 \(AC 매핑\)\*\*'
    fence_aware: true
    cardinality_basis: id_occurrence_count
    leg3: not_applicable
