# --- grandfather (ADR-180 §결정 5) -----------------------------------------
# ceiling(key) = entries[key].ceiling  if key ∈ entries   # grandfather
#              = default_ceiling       otherwise          # 신규 — 면제 아님
# ratchet(touched): ceiling ← min(ceiling, metric(HEAD))  # monotonic shrink
# `entries` 미등재를 "제한 없음" 으로 읽는 구현을 금지한다.
entries:
  - story_key: CFP-2986
    ceiling: 327987
    ceiling_basis: NO_SELF_EXEMPTION_EQUALS_DEFAULT   # carrier 자기 면제 0 — default 와 동일값
