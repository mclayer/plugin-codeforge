# docs/hollow-gate-corpus-manifest.yaml
# hollow-gate corpus sidecar manifest — 판정 하네스(scripts/check-hollow-gate-corpus.sh)의 유일 입력 좌표.
#
# Carrier Story: CFP-2963 (landed 게이트 hollow 여부 동적 분류)
# Carrier ADR:   ADR-175 (landed-gate-corpus-dynamic-hollow-classification)
# 판정 core:     scripts/lib/check_hollow_gate_corpus.py  (계약·정직 천장·미결 확정 = 그 docstring 이 SSOT)
#
# 본 파일의 성격:
#   - 정적 좌표 SSOT. **판정 결과를 담지 않는다**. verdict 는 매 실행의 leg 관측에서만 나온다.
#   - 4블록: gates(판정기 가시 · arm-invariant) / samples(평면 배치) / build(판정기 projection 제외) /
#     classification(reconciler 전용 · **판정기 미투입**).
#   - classification 은 판정 함수에 도달하지 않는다. 판정 후 대조(reconcile)에만 쓴다.
#     `_verdict()` 시그니처에 arm/declared/expected 가 구조적으로 부재 = 이 분리의 기계적 근거.
#
# 금지키 denylist (명명 3종 — non_applicable / waiver / xfail):
#   설계 문면은 "9종(non_applicable · waiver · xfail 등)" 이라 적으나 **명명된 것은 3종뿐이며 나머지
#   6종과 '9' 라는 수의 술어(모집단·판정 규칙)는 어디에도 기재돼 있지 않다.** core 는 명명 3종만
#   강제하고(키공간 교집합 != 공집합 = exit 3) 그 사실을 docstring 에 정직 기록한다. 6종을 추정으로
#   지어내지 않는다. 설계가 나머지를 명시하면 그때 상수를 확장한다.

schema_version: "1.0"

# ── gates: 판정기 가시 좌표 (arm-invariant — arm 정보 없음) ───────────────────────
gates:
  - id: check-hard-gate-self-verification
    # 원 게이트(현행) — stamp.source_sha256 대조 정의역. drift = exit 3 substrate-failure(자동 갱신 금지).
    source_path: scripts/lib/check_hard_gate_self_verification.py
    # exec dir 안 materialize 된 이름 (at-rest 는 `gate.py.sample`, materialize 시 `.sample` 을 벗긴다).
    entry: gate.py
    # 명시 인자 주입 only — `cd <fixture>` + bare 호출 금지. {fixture} = 그 leg 의 materialize 된 fixture 루트.
    invoke_args: ["--repo-root", "{fixture}"]
    fail_marker_stream: stderr
    terminal_marker_stream: stdout
    # kill_target_stage (T-3 바인딩). day-1 실측: fail_stage(s01 kill) = {AC-1, SUMMARY} → AC-1 적중,
    # fail_stage(s01 xkill) = {AC-8, SUMMARY} → AC-1 부재 = 축-disjoint 성립.
    # 주의: 상수 footer(SUMMARY)를 여기 선언하면 xkill 의 fail_stage 에도 상주해 자동 적중(공허 선언)이
    #   되며, core 의 xkill 축-disjoint 검사(M6)가 이를 exit 1 로 잡는다 — 유일 기계 검출자.
    fail_marker_stage_id: "AC-1"
    terminal_marker_prefix: "✓ check-hard-gate-self-verification:"
    # T-2 exit_space — {0,1,2} 가 아니라 [0, 1] 로 **좁힌** 근거(설계가 구현에 위임한 미결):
    #   원 게이트의 실 exit space 는 {0,1,2} 이나 rc=2 는 argparse usage 전용(미지 플래그·잉여 positional).
    #   corpus leg 은 위 invoke_args 명시 주입으로만 구동하므로 rc=2 관측 = **표본 구동 오류**이며
    #   I-4(rc 이탈)로 잡아야 한다. {0,1,2} 를 그대로 선언하면 I-4 가 이 게이트에서 영구 발동 불가가
    #   되어 "선언됐는데 절대 안 걸리는 조건" = 본 Story 가 겨냥한 hollow 패턴 그 자체가 된다.
    #   T-2ⓐ: 미선언/빈 리스트는 loud 실패(exit 3) — `rc ∉ ∅` 공허 참 경로를 만들지 않는다.
    #   day-1 실측 rc: kill=1 / clean=0 / empty=0 / xkill=1 → 전건 [0,1] 안 → I-4 미발동.
    exit_space: [0, 1]

# ── samples: 평면 배치 (arm 어휘 미등장 — 표본 id 는 s01/s02 중립 좌표) ────────────
#   fixtures = leg role → 디렉터리명. 4 role(kill/clean/empty/xkill) 전건 등재 의무 —
#   미등재 시 그 디렉터리가 bijection orphan 이 되어 exit 3 (⓸).
samples:
  - id: s01
    gate: check-hard-gate-self-verification
    path: tests/fixtures/hollow-gate-corpus/s01
    fixtures: { kill: kill, clean: clean, empty: empty, xkill: xkill }
  - id: s02
    gate: check-hard-gate-self-verification
    path: tests/fixtures/hollow-gate-corpus/s02
    fixtures: { kill: kill, clean: clean, empty: empty, xkill: xkill }

# ── build: 파생 recipe (판정기 projection 제외 — verdict 함수 미투입) ──────────────
#   - `sample:` 항목 = 커밋 표본의 파생 provenance 기록. **I-1 의 정의역이 아니다** —
#     I-1(anchor 매치 != 1 = INDETERMINATE)은 run-time recipe unit(`probe:`)에만 도달한다.
#     커밋 sample unit 은 core 의 units 구성에서 recipe=None 으로 실려 I-1 가드에 구조적으로
#     미도달이기 때문이다. 커밋 `sample:` 파생은 core 의 **provenance 검사(⓺ 확장, exit 3
#     substrate-failure)** 소관이다 — ① derived_from 원본 target 의 anchor 매치 수 == 1
#     ② recipe 재적용 결과 sha256 == 커밋 표본 target ③ 두 표본 트리가 recipe target 과
#     stamp.yaml.sample 2개를 제외하고 전 파일 byte-identical.
#   - `probe:` 항목 = **커밋되지 않는** blinded 섭동. run-time 에 materialize 한다.
#     (커밋 표본으로 두면 평범한 arm-H 와 구별 불가가 되어 IC-1 좌표 충돌 성질이 소멸한다.)
#     설계 의도: probe 는 커밋 좌표(gate id / stamp / 원 표본 / fixture 집합)에서 s01 과 일치하고
#     기대 verdict 만 반대다 — 출력이 커밋 좌표만의 함수인 판정기는 정의상 한쪽에서 틀린다.
#     ★ core 가 IC-1 로 **실제 측정하는 것** = `derived_from` 이 arm-L 선언 표본인가(armL-anchored).
#     좌표 동일성 자체는 units 구성상 항진(probe 는 derived_from 표본을 그대로 원본으로 쓴다)이라
#     측정 대상이 아니다 — 항진명제를 측정한 것처럼 emit 하지 않는다 (F-CR18-10 정정).
build:
  - sample: s02
    derived_from: s01
    target: gate.py.sample
    anchor_from: "    if not any(a in text for a in _POSITIVE_CONTROL_ANCHORS):"
    anchor_to: "    if False:  # neutralized M1 positive-control-presence"
  - probe: p01
    derived_from: s01
    target: gate.py.sample
    anchor_from: "    if not any(a in text for a in _POSITIVE_CONTROL_ANCHORS):"
    anchor_to: "    if False:  # neutralized M1 positive-control-presence"

# ── classification: reconciler 전용 (판정기 미투입) ───────────────────────────────
#   declared_arm ↔ expected_verdict 는 L↔LIVE / H↔HOLLOW 로 고정 결박된다(core 가 강제).
#   재라벨링(예: 실패하는 arm-L 을 H 로 바꿔 통과)으로 빠져나가는 경로를 닫기 위함이다.
classification:
  - sample: s01
    declared_arm: L
    expected_verdict: LIVE
  - sample: s02
    declared_arm: H
    expected_verdict: HOLLOW
  - probe: p01
    declared_arm: H
    expected_verdict: HOLLOW
