          cat /tmp/ng18.json
          cat /tmp/ng18.err
          rc=3
          printf 'NG-18 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          {
            echo "### NG-18 — INCONCLUSIVE (고정 선언)"
            echo ""
            echo "배선은 정정됐다(argparse 미지원 인자 제거 → 검사 로직 도달). 그러나 비교 의미가 아직 부당하다:"
            echo ""
            echo "- ⓐ \`expected\` = workflow **파일 개수**, \`actual\` = 커밋이 트리거한 **run 수** — 서로 다른 양."
            echo "- ⓑ \`gh run list --json name\` 에 \`--limit\` 부재 → 기본 20 절단 ⇒ \`actual\` 은 20 을 못 넘는다."
            echo ""
            echo "⇒ 따라서 이 스텝의 verdict 는 **PASS 도 FAIL 도 주장하지 않는다**(exit 3). 위 rc/JSON 은 진단용."
            echo "산술 코어는 판별력이 있다(5/5→PASS, 5/2→RED) — 결함은 **입력 정의**에 있다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::NG-18 INCONCLUSIVE — 배선정정·but 입력정의부당 → CI패킷부재와 유사 상황(PASS 아님). ratchet대상."

