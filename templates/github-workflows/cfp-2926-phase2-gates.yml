        run: |
          set -u
          # ────────── ① 배선 정정 (born-broken 해소) ──────────
          # 이전 판본은 `--gh-token`·`--run-id` 를 넘겼는데 check_ci_run_completeness.py 의
          # argparse 가 아는 인자는 `--repo-root` / `--commit` / `--expected` / `--actual` 4개뿐이다.
          # ⇒ argparse 오류 → 스크립트가 exit 2 → 아래 case 의 `*)` 분기 → "undefined exit code 2"
          #   후 exit 1. 즉 검사 로직에 ★도달조차 못 하고 항상 죽었다★ (born-broken).
          #   이제 스크립트가 실제로 지원하는 인자만 넘긴다. (GH_TOKEN 은 스크립트가 내부에서
          #   호출하는 `gh run list` 의 인증용이라 env 로 유지한다.)
          #
          # ────────── ② 정직 선언: 배선을 고쳐도 비교 의미가 부당하다 ──────────
          #   ⓐ expected = `.github/workflows/*.yml` ★파일 개수★ 인데
          #      actual   = 그 커밋이 실제 트리거한 ★run 수★ — 서로 다른 양을 비교한다
          #      (모든 workflow 가 모든 커밋에 트리거되지는 않는다).
          #   ⓑ check_ci_run_completeness.py 의 `gh run list --json name` 에 `--limit` 이 없어
          #      기본 20 에 절단된다 (실측: 미지정 20 vs `--limit 100` 82).
          #      ⇒ actual 은 구조적으로 20 을 넘지 못한다.
          #   ⇒ 이 상태에서 나오는 RED 는 큐 drop 증거가 아니라 입력 정의 오류의 산물이다.
          #     거짓 RED 로 PASS/FAIL 을 참칭하지 않고 exit 3(INCONCLUSIVE)로 고정 선언한다.
          #     ★exit 0 으로 눕히지 않는다★ — INCONCLUSIVE ≠ GREEN (검사연극 금지).
          #   ⇒ ★산술 코어 자체는 살아 있다★ (실측: `--expected 5 --actual 5` → exit 0
          #     `ci_run_count_complete` / `--expected 5 --actual 2` → exit 1 `ci_run_count_mismatch`).
          #     고쳐야 할 것은 코어가 아니라 ★입력 정의★다 (expected·actual 의 양 자체) —
          #     그 정정은 본 스텝 소관 밖(스크립트 변경 필요)이라 후속 과제로 남긴다.
          python3 scripts/lib/check_ci_run_completeness.py \
            --repo-root . \
            --commit "$NG18_COMMIT" > /tmp/ng18.json 2> /tmp/ng18.err || rc=$?
