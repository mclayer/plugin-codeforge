name: CFP-2926 Phase 2 — Integrity Gates (NG-1~NG-21)

# CFP-2926 Phase 2 구현 — ADR-154 규정 신규 게이트 21종 배선.
#
# NG-1~21 전부 ci-편입 (warning-tier, required context 미등재 — ADR-171).
# 게이트별 4-item ADR-154 번들(empty-target/unknown-input/execution-trace/identity_bearing)
# 전건 회귀 테스트는 Phase 2 self-test 스크립트 책임 (selftest-execution-liveness-inventory.yaml).
#
# 축 분리(§7.16): 자원/실패모드/SSOT disjoint — 21개 gates job 병렬도 max=8.
#
# 게이트 매핑:
#   NG-1 (AC-4): check_census_oracle.py
#   NG-2 (AC-5): check_fanout_subject_prose.py
#   NG-3 (AC-6): check_platform_inherent_prose.py + frozen_anchor.py
#   NG-4 (AC-8): check_doc_queue_ssot.py [신규]
#   NG-5 (AC-10): check_lane_dispatch_packet.py
#   NG-6 (AC-14): compute_write_overlap.py
#   NG-7 (AC-15): check_pl_spawn_observation.py
#   NG-8 (AC-16): check_lane_overlap_predicate.py
#   NG-9 (AC-2b): compute_concurrency_metric.py
#   NG-10 (contract): check_spawn_event_location_parity.py [신규]
#   NG-11 (contract): check_dev_process_event_location_parity.py [신규]
#   NG-12 (H-2): check_hook_merge_registration.py
#   NG-13 (return-envelope): check_return_envelope_handle.py
#   NG-14 (AC-3 문면): check_stop_event_prose.py [신규]
#   NG-15 (AC-3 동시): check_stop_event_concurrent_append.py [신규]
#   NG-16 (AC-1 L1): check_subagent_stop_auto_emit.py
#   NG-17 (sentinel): check_parallel_work_sentinel.py [개정]
#   NG-18 (CI 유실): check_ci_run_completeness.py
#   NG-19 (AC-7): check_story_diff_adr064.py [신규]
#   NG-20 (AC-9): check_klist_untouched.py [신규]
#   NG-21 (AC-12): check_slot_budget_table.py [신규]
#
# 메타-게이트 (NG 인벤토리 밖 — 규칙 R 의 세 번째 대조축, §9.8 (5) 승계 X-16):
#   X-16: check_ng_registry_bijection.py — docs/evidence-checks-registry.yaml NG 행 집합
#         ↔ Story §8.0.8 (1) NG 표 bijection assert.
#         ★대조 상대(Story SSOT)는 별 repo(mclayer/codeforge-internal-docs)에 있다★ —
#         모듈은 fetch 하지 않고 caller 가 materialize 한 로컬 경로만 --story 로 받는다
#         (모듈 docstring §"Story 파일 접근 한계"). 따라서 본 workflow 가 cross-repo materialize
#         책임을 진다. 미배선(=--story 미전달) 상태에서는 게이트가 영구 INCONCLUSIVE(exit 3)로
#         정직 선언만 하고 bijection 을 ★검증하지 않는다★ — 그 구멍을 아래 gate-x16-bijection job 이 닫는다.
#
# 명명 테스트 job (phase2-unit-tests):
#   ★여러 게이트의 실 검출력은 게이트 스크립트가 아니라 tests/unit/cfp_2926/ 명명 테스트에 있다★.
#   예) NG-5·NG-13 은 caller-supplied predicate 라 CI 상시 호출 대상이 아니고(스텝은 exit 3),
#       NG-12·NG-17 은 게이트 자신이 못 잡는 mutant 를 명명 테스트가 잡는다.
#   그런데 이 디렉터리는 어느 workflow 에서도 실행되지 않았다 (lint.yml 의 hook-unit-tests 는
#   `hooks/tests overlay/hooks/tests` 만 돈다 — tests/unit/ 미포함) ⇒ 회귀가 나도 붉어지지 않았다.
#   그 구멍을 아래 phase2-unit-tests job 이 닫는다 (설치 패턴 선례 = lint.yml hook-unit-tests).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  # cross-repo Story materialize venue 화이트리스트 (zero-trust anchor, strict match — 미일치 = fail-closed).
  #   선례 `.github/workflows/ac-traceability-matrix.yml` L44 와 ★동일 리터럴★.
  ALLOWED_HUB_REPOS: "mclayer/codeforge-internal-docs"
  # X-16 대조 상대(Story SSOT) URI. 선례 fetchDoc 이 파싱하는 것과 ★같은 형태★
  #   (`github.com/<owner>/<repo>/blob/<ref>/<path>`, 선례 L147) — 같은 정규식·같은 화이트리스트 가드 재사용.
  #   ★왜 PR body `story_uri` 마커가 아닌 상수인가★: 선례가 마커를 파싱하는 이유(L102-104)는 임의 Story 를
  #   PR 마다 해석해야 하기 때문이다. 본 workflow 는 ★단일 Story 전용★(파일명·모듈 STORY_KEY 모두
  #   CFP-2926 고정)이고 트리거에 `push: main` 과 `workflow_dispatch` 가 포함돼 PR body 자체가 없는
  #   실행면이 존재한다 — 마커 입력경로를 쓰면 그 실행면에서 구조적으로 영구 INCONCLUSIVE 가 된다.
  #   `ref=main` = 선례가 명시 인정한 ★영구 ref★(L92 "story_uri = 영구 ref(internal-docs main / immutable commit SHA)").
  X16_STORY_URI: "https://github.com/mclayer/codeforge-internal-docs/blob/main/wrapper/stories/CFP-2926.md"
  # CI 에서 구조적으로 판정 불가(INCONCLUSIVE)임을 ★사전 선언★한 게이트.
  # 선언 = 면제가 아니라 "돌리지 않음"의 명시다. 각 항목의 실 검증면은 해당 step 주석에 있다.
  # NG-17: no_comparison_worktree — fresh CI checkout 에는 비교 대상 sibling worktree 가
  #        구조적으로 존재 불가 (실 검증면 = tests/unit/cfp_2926/test_ac16_lane_overlap.py).
  CI_INCONCLUSIVE_DECLARED: "NG-5 NG-13 NG-16 NG-17 NG-18"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates-ng1-ng9:
    name: NG-1 to NG-9 (AC/AC-2b metrics)
    runs-on: ubuntu-latest
    if: github.repository == 'mclayer/plugin-codeforge'
    continue-on-error: true  # warning-tier (ADR-171)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet pyyaml jsonschema

      - name: NG-1 | AC-4 census oracle
        id: ng1
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_census_oracle.py --self-test || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-1 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-1 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-1 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-2 | AC-5 fan-out prose
        id: ng2
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_fanout_subject_prose.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-2 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-2 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-2 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-3 | AC-6 platform inherent + frozen anchor
        id: ng3
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_platform_inherent_prose.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-3 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-3 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-3 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-4 | AC-8 doc-queue SSOT
        id: ng4
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_doc_queue_ssot.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-4 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-4 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-4 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-5 | AC-10 dispatch packet snapshot_sha
        id: ng5
        if: always()
        run: |
          set -u
          # NG-5 = AC-10 dispatch packet checker: caller-supplied predicate (identity_bearing: false)
          # CI 상시 호출 대상 아님 — 검사 대상 패킷을 --packet 으로 호출자가 줘야 하는데
          # CI 에는 고정 대상 패킷이 없다. 따라서 이 스텝은 rc=3 INCONCLUSIVE 로 정직 선언한다.
          #
          # 실 검증면 = tests/unit/cfp_2926/test_contracts_envelope_dispatch.py::test_dispatch_packet_requires_snapshot_sha
          #   ★그 테스트는 check_lane_dispatch_packet.py 를 subprocess 로 실제 호출한다★ —
          #   양성 대조(유효 패킷=PASS) + snapshot_sha 누락(RED) + 40자 hex 위반 3종(RED).
          #   이전 판본은 자기가 쓴 dict 를 자기가 다시 읽는 동어반복이어서 게이트에서
          #   snapshot_sha 요구·검증을 전부 제거해도 통과했다 — 즉 이 지목이 거짓이었다 (CFP-2926 봉합).
          #   ⇒ 그 테스트는 아래 phase2-unit-tests job 이 CI 에서 실제로 실행한다.
          rc=3
          printf 'NG-5 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          echo "::notice::NG-5 INCONCLUSIVE — CI 에 caller packet 부재로 ★미실행★(PASS 아님). 실 검증면은 위 주석의 명명 테스트."

      - name: NG-6 | AC-14 write overlap
        id: ng6
        if: always()
        run: |
          set -u
          python3 scripts/lib/compute_write_overlap.py --self-test || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-6 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-6 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-6 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-7 | AC-15 PL spawn observation
        id: ng7
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_pl_spawn_observation.py --self-test || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-7 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-7 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-7 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-8 | AC-16 lane overlap predicate
        id: ng8
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_lane_overlap_predicate.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-8 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-8 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-8 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-9 | AC-2b concurrency metric
        id: ng9
        if: always()
        run: |
          set -u
          python3 scripts/lib/compute_concurrency_metric.py --self-test || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-9 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-9 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-9 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: Reconcile ng1-ng9
        if: always()
        env:
          CI_INCONCLUSIVE_DECLARED: ${{ env.CI_INCONCLUSIVE_DECLARED }}
        run: |
          set -u
          echo "## NG-1 to NG-9 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

          # .gate-verdicts.txt 읽기
          if [ ! -f "$GITHUB_WORKSPACE/.gate-verdicts.txt" ]; then
            echo "::error::NG-1~9 .gate-verdicts.txt 미발생 — 게이트 step 이 실행되지 않았을 가능성"
            exit 1
          fi

          # 담당 범위(NG-1~9)의 verdicts 읽기
          declare -A verdicts
          while read -r line; do
            gate=$(echo "$line" | cut -d' ' -f1)
            rc=$(echo "$line" | cut -d' ' -f2)
            verdicts[$gate]=$rc
          done < "$GITHUB_WORKSPACE/.gate-verdicts.txt"

          # 표 렌더 + 미실행 검출
          for i in 1 2 3 4 5 6 7 8 9; do
            gate="NG-$i"
            if [ -z "${verdicts[$gate]:-}" ]; then
              echo "::error::$gate verdict 줄 누락 — step 이 실행되지 않음 (D1 재발)"
              exit 1
            fi
            rc="${verdicts[$gate]}"
            case "$rc" in
              0) status="PASS" ;;
              1) status="RED" ;;
              3) status="INCONCLUSIVE" ;;
              *) status="UNKNOWN($rc)" ;;
            esac
            echo "| $gate | \`$status\` |" >> $GITHUB_STEP_SUMMARY
          done

          # allowlist 양방향 bijection 검증
          declare -A declared_gates
          for gate in $CI_INCONCLUSIVE_DECLARED; do
            declared_gates[$gate]=1
          done

          # 미선언 게이트가 3을 냈는지 검증
          for i in 1 2 3 4 5 6 7 8 9; do
            gate="NG-$i"
            rc="${verdicts[$gate]}"
            if [ "$rc" = "3" ] && [ -z "${declared_gates[$gate]:-}" ]; then
              echo "::error::$gate 가 INCONCLUSIVE(3) 를 냈으나 CI_INCONCLUSIVE_DECLARED 에 없음 (미선언 INCONCLUSIVE)"
              exit 1
            fi
          done

          # 선언된 게이트가 0/1을 냈는지 검증 (ratchet-UP)
          for gate in $(echo $CI_INCONCLUSIVE_DECLARED | tr ' ' '\n' | grep '^NG-[1-9]$'); do
            rc="${verdicts[$gate]:-}"
            if [ -n "$rc" ] && [ "$rc" != "3" ]; then
              echo "::error::$gate 는 CI_INCONCLUSIVE_DECLARED 에 있으나 $rc 를 냈음 (판정 가능해졌으면 allowlist 에서 빼라 — ratchet-UP)"
              exit 1
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ NG-1~9 reconcile 완료 (allowlist 양방향 bijection 통과)" >> $GITHUB_STEP_SUMMARY

  gates-ng10-ng15:
    name: NG-10 to NG-15 (contract integrity + AC-3)
    runs-on: ubuntu-latest
    if: github.repository == 'mclayer/plugin-codeforge'
    continue-on-error: true  # warning-tier
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet pyyaml jsonschema

      - name: NG-10 | spawn-event 4-location parity
        id: ng10
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_spawn_event_location_parity.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-10 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-10 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-10 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-11 | dev-process-event 5-location parity
        id: ng11
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_dev_process_event_location_parity.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-11 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-11 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-11 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-12 | hook merge registration
        id: ng12
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_hook_merge_registration.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-12 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-12 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-12 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-13 | return-envelope handle
        id: ng13
        if: always()
        run: |
          set -u
          # NG-13 = return-envelope handle checker: caller-supplied predicate (identity_bearing: false)
          # CI 상시 호출 대상 아님 — 검사 대상 envelope 를 --envelope 로 호출자가 줘야 하는데
          # CI 에는 고정 대상 envelope 가 없다. 따라서 이 스텝은 rc=3 INCONCLUSIVE 로 정직 선언한다.
          #
          # 실 검증면 = tests/unit/cfp_2926/test_contracts_envelope_dispatch.py::test_return_envelope_requires_handle
          #   ★그 테스트는 check_return_envelope_handle.py 를 subprocess 로 실제 호출한다★ —
          #   양성 대조(PASS) + meta.evidence_ref 공백(RED evidence_ref_empty)
          #   + artifact handle 2종(artifact_path·rerun_command) 전무(RED artifact_handle_missing).
          #   이전 판본은 자기가 쓴 `{"handle": ...}` 을 자기가 다시 읽는 동어반복인 데다
          #   검사하던 필드명(`handle`)이 스크립트가 실제로 보는 필드와 아예 달라서,
          #   _check_handle 을 통째로 무력화해도 통과했다 — 즉 이 지목이 거짓이었다 (CFP-2926 봉합).
          #   ⇒ 그 테스트는 아래 phase2-unit-tests job 이 CI 에서 실제로 실행한다.
          rc=3
          printf 'NG-13 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          echo "::notice::NG-13 INCONCLUSIVE — CI 에 caller envelope 부재로 ★미실행★(PASS 아님). 실 검증면은 위 주석의 명명 테스트."

      - name: NG-14 | AC-3 stop-event prose (false guarantee)
        id: ng14
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_stop_event_prose.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-14 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-14 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-14 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-15 | AC-3 stop-event concurrent append
        id: ng15
        if: always()
        run: |
          set -u
          python3 scripts/lib/check_stop_event_concurrent_append.py --repo-root . || rc=$?
          rc=${rc:-0}
          case $rc in
            0|1|3) ;;
            *) echo "::error::NG-15 returned undefined exit code $rc (3-state must be 0/1/3)"; exit 1 ;;
          esac
          printf 'NG-15 %s\n' "$rc" >> "$GITHUB_WORKSPACE/.gate-verdicts.txt"
          case $rc in
            1) exit 1 ;;
            3) echo "::notice::NG-15 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: Reconcile ng10-ng15
        if: always()
        env:
          CI_INCONCLUSIVE_DECLARED: ${{ env.CI_INCONCLUSIVE_DECLARED }}
        run: |
          set -u
          echo "## NG-10 to NG-15 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

