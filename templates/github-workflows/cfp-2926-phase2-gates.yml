            3) echo "::notice::NG-20 INCONCLUSIVE — 판정 없음(PASS 아님). allowlist 대조는 reconcile 스텝이 수행." ;;
          esac

      - name: NG-21 | AC-12 slot budget table sum
        id: ng21
