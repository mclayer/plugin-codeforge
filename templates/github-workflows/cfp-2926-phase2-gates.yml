            echo "::error::NG-10~15 .gate-verdicts.txt 미발생 — 게이트 step 이 실행되지 않았을 가능성"
            exit 1
          fi

          # 담당 범위(NG-10~15)의 verdicts 읽기
          declare -A verdicts
          while read -r line; do
            gate=$(echo "$line" | cut -d' ' -f1)
            rc=$(echo "$line" | cut -d' ' -f2)
            verdicts[$gate]=$rc
          done < "$GITHUB_WORKSPACE/.gate-verdicts.txt"

          # 표 렌더 + 미실행 검출
          for i in 10 11 12 13 14 15; do
            gate="NG-$i"
            if [ -z "${verdicts[$gate]:-}" ]; then
              echo "::error::$gate verdict 줄 누락 — step 이 실행되지 않음 (D1 재발)"
              exit 1
            fi
            rc="${verdicts[$gate]}"
            case "$rc" in
              0) status="PASS" ;;
              1) status="RED" ;;
              3) status="INCONCLUSIVE" ;;
              *) status="UNKNOWN($rc)" ;;
            esac
            echo "| $gate | \`$status\` |" >> $GITHUB_STEP_SUMMARY
          done

          # allowlist 양방향 bijection 검증
          declare -A declared_gates
          for gate in $CI_INCONCLUSIVE_DECLARED; do
            declared_gates[$gate]=1
          done

          # 미선언 게이트가 3을 냈는지 검증
          for i in 10 11 12 13 14 15; do
            gate="NG-$i"
            rc="${verdicts[$gate]}"
            if [ "$rc" = "3" ] && [ -z "${declared_gates[$gate]:-}" ]; then
              echo "::error::$gate 가 INCONCLUSIVE(3) 를 냈으나 CI_INCONCLUSIVE_DECLARED 에 없음 (미선언 INCONCLUSIVE)"
              exit 1
            fi
          done

          # 선언된 게이트가 0/1을 냈는지 검증 (ratchet-UP)
          for gate in $(echo $CI_INCONCLUSIVE_DECLARED | tr ' ' '\n' | grep -E '^NG-(1[0-5])$'); do
            rc="${verdicts[$gate]:-}"
            if [ -n "$rc" ] && [ "$rc" != "3" ]; then
              echo "::error::$gate 는 CI_INCONCLUSIVE_DECLARED 에 있으나 $rc 를 냈음 (판정 가능해졌으면 allowlist 에서 빼라 — ratchet-UP)"
              exit 1
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ NG-10~15 reconcile 완료 (allowlist 양방향 bijection 통과)" >> $GITHUB_STEP_SUMMARY

  gates-ng16-ng21:
    name: NG-16 to NG-21 (runtime + doc/config)
